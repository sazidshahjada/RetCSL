name: retcsl
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.1
  - numpy=1.26.*
  - scikit-learn=1.5.*
  - matplotlib
  - pillow
  - tqdm
  - hdbscan
  - ipykernel
  - jupyterlab
  - pip:
      - albumentations>=2.0,<3
      - timm>=1.0,<2
      - open_clip_torch==2.23.0
      - transformers==4.35.2
      - git+https://github.com/openai/CLIP.git

# Create and activate with:
#   conda env create -f environment.yml
#   conda activate retcsl
#   python -m ipykernel install --user --name retcsl --display-name "Python (retcsl)"
#
# The PyTorch/CUDA pins follow the RETFound repository's documented setup.
# For CPU-only systems, remove pytorch-cuda=12.1 and install the CPU PyTorch
# build from the pytorch channel instead.
